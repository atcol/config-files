name: "Test"
on:
  pull_request:
  push:
    branches: [master]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2.3.4
      with:
        # Vendored skills under ai/vendor are submodules; without them
        # the skill paths don't exist and evaluation fails.
        submodules: recursive
    - uses: cachix/install-nix-action@v13
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - name: Install home-manager
      run: |
        nix-channel --add https://github.com/nix-community/home-manager/archive/master.tar.gz home-manager
        nix-channel --update
        export NIX_PATH=$HOME/.nix-defexpr/channels${NIX_PATH:+:}$NIX_PATH
        nix-shell '<home-manager>' -A install
        mkdir -p ~/.config/nixpkgs
        rm -rf ${HOME}/.config/nixpkgs/home.nix
        ln -s ${PWD}/home.nix ${HOME}/.config/nixpkgs/home.nix
        export PATH=$HOME/.nix-profile/bin:$PATH
        home-manager switch
    - name: Verify installed packages
      run: |
        export PATH=$HOME/.nix-profile/bin:$PATH
        echo "Verifying key packages are installed..."
        command -v git
        command -v gh
        command -v jq
        command -v ripgrep || command -v rg
        command -v bat
        command -v fd
        command -v tmux
        command -v fzf
        command -v starship
        command -v kubectl
        command -v kraken
        echo "All expected packages verified."
    - name: Verify Matt Pocock skills are installed
      run: |
        set -e
        for skill in grill-me grill-with-docs retro wayfinder grilling domain-modeling research prototype writing-for-agents setup-matt-pocock-skills; do
          test -f "${HOME}/.claude/skills/$skill/SKILL.md" || (echo "Missing Claude skill: $skill" && exit 1)
          test -f "${HOME}/.codex/skills/$skill/SKILL.md" || (echo "Missing Codex skill: $skill" && exit 1)
          test -f "${HOME}/.gemini/skills/$skill/SKILL.md" || (echo "Missing Gemini skill: $skill" && exit 1)
          test -f "${HOME}/.gemini/commands/$skill.toml" || (echo "Missing Gemini command: $skill" && exit 1)
        done
        # Codex reads agents/openai.yaml for display name + invocation policy
        test -f "${HOME}/.codex/skills/wayfinder/agents/openai.yaml" || (echo "Codex wayfinder missing openai.yaml" && exit 1)
        # Supporting docs must survive installation for all three harnesses.
        for harness in claude codex gemini; do
          for reference in domain-modeling/GLOSSARY-FORMAT.md domain-modeling/ADR-FORMAT.md writing-for-agents/SKILL-MECHANICS.md prototype/LOGIC.md prototype/UI.md; do
            test -f "${HOME}/.$harness/skills/$reference" || (echo "Missing $harness reference: $reference" && exit 1)
          done
        done
        echo "Matt Pocock skills verified across Claude, Codex and Gemini."
    - name: Verify Claude and Codex install the same skill set
      run: |
        set -e
        # Both tools source ./local-skills.nix and ./matt-pocock-skills.nix, so
        # their installed sets must match exactly. They used to be two hand-kept
        # lists, and cpp-cmake and worktrunk went missing from Codex that way.
        # Impeccable uses Codex's current ~/.agents/skills discovery directory.
        diff <(ls "${HOME}/.claude/skills" | sort) <(
          for dir in "${HOME}/.codex/skills" "${HOME}/.agents/skills"; do
            if [ -d "$dir" ]; then ls "$dir"; fi
          done | sort -u
        ) \
          || (echo "Claude and Codex skill sets have diverged" && exit 1)
        for skill in $(ls ai/skills) security-audit; do
          test -f "${HOME}/.claude/skills/$skill/SKILL.md" || (echo "Missing Claude skill: $skill" && exit 1)
          test -f "${HOME}/.codex/skills/$skill/SKILL.md" || (echo "Missing Codex skill: $skill" && exit 1)
        done
        echo "Claude and Codex install an identical skill set."
    - name: Verify shell configuration
      run: |
        export PATH=$HOME/.nix-profile/bin:$PATH
        test -f ${HOME}/.config/fish/config.fish && echo "Fish config exists" || (echo "Fish config missing" && exit 1)
